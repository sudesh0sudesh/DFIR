name: Custom.Windows.Registry.PuttySessions.Loglocations
author: Sudesh Yalavarthi
description: |
   This artifact extracts PuTTY SSH Log locations.
   It looks for LogFileName entries in PuTTY sessions.
   
type: CLIENT

parameters:
   - name: KeyGlob
     default: Software\SimonTatham\Putty\Sessions\*\LogFileName
     description: Registry path to PuTTY log file locations
   - name: TargetUser
     default: .
     description: Filter by specific username (regex)
   - name: TargetKeyName
     default: .
     description: Filter by specific key name (regex)
   - name: TargetKeyValue
     default: .
     description: Filter by specific log file path (regex)

sources:
  - precondition:
      SELECT OS From info() where OS = 'windows' 

    query: |
      SELECT 
        Mtime AS LastModified,
        Username,
        OSPath.Basename AS KeyName,
        Data.value AS LogFilePath,
        OSPath.DelegatePath AS SourcePath,
        split(sep='\\\\', string=OSPath.Path)[-2] AS SessionName
      FROM Artifact.Windows.Registry.NTUser(
        KeyGlob=KeyGlob,
        userRegex=TargetUser
      )
      WHERE 
        KeyName =~ TargetKeyName AND 
        Data.value =~ TargetKeyValue
      ORDER BY LastModified DESC
